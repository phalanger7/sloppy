# Configuration for the project's QA tooling (see qa.toml + qa-gate/).
#
# vulture discovers the Textual convention-based members — CSS, BINDINGS,
# compose, on_mount, on_unmount, and the on_<Message> handlers — purely
# through framework reflection, so it can't see the references and would flag
# them as dead code. Listing them here keeps the gate green without weakening
# the check. Nothing else here affects the ruff/complexity/test scans.
[tool.vulture]
ignore_names = [
    "CSS",
    "BINDINGS",
    "compose",
    "on_mount",
    "on_unmount",
    "on_log_line",
    "on_button_pressed",
    # Referenced only by the BINDINGS key string, not a framework hook.
    "action_show_llm_debug",
    "action_show_summary",
    "action_show_profiles",
    "action_toggle_vision",
    "action_toggle_pause",
    # Read by the framework to render the modal border title; set in on_mount.
    "border_title",
]
